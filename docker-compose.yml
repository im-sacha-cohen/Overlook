services:
  postgres-dev:
    image: postgres:16
    environment:
      POSTGRES_USER: overlook
      POSTGRES_PASSWORD: overlook
      POSTGRES_DB: overlook_dev
    ports:
      - "5433:5432"
    volumes:
      - ./dev/seed-postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  mysql-dev:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: overlook
      MYSQL_DATABASE: overlook_dev
      MYSQL_USER: overlook
      MYSQL_PASSWORD: overlook
    ports:
      - "3307:3306"
    volumes:
      - ./dev/seed-mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
